<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Detection - Wildfire Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --coral: #FF8B6B;
            --warm-orange: #FFB067;
            --light-yellow: #FFE5A3;
            --sage-green: #A6B985;
            --text-dark: #2C3E50;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--coral) 0%, var(--warm-orange) 50%, var(--light-yellow) 100%);
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .navbar-brand {
            color: var(--text-dark);
            font-weight: 700;
            font-size: 1.5rem;
        }

        .navbar-brand:hover {
            color: var(--coral);
        }

        .nav-link {
            color: var(--text-dark) !important;
            margin: 0 1rem;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: var(--coral) !important;
        }

        .nav-link.active {
            color: var(--coral) !important;
            font-weight: 600;
        }

        .live-section {
            text-align: center;
            padding: 3rem 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, rgba(255, 229, 163, 0.9), rgba(166, 185, 133, 0.9));
            backdrop-filter: blur(10px);
            margin: 2rem;
            border-radius: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .live-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            background: linear-gradient(45deg, var(--coral), var(--warm-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.1));
        }

        .camera-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 800px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            position: relative;
        }

        .camera-container:hover {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        #video {
            width: 100%;
            max-width: 720px;
            border-radius: 15px;
            margin-bottom: 1rem;
        }

        #canvas {
            display: none;
        }

        .controls {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn-camera {
            background: linear-gradient(45deg, var(--coral), var(--warm-orange));
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-camera:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            color: white;
        }

        .btn-camera:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .detection-overlay {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.9);
            padding: 1rem;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: none;
        }

        .detection-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .confidence-text {
            font-size: 1rem;
            color: var(--text-dark);
            opacity: 0.8;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
        }

        .status-active {
            background-color: var(--sage-green);
            box-shadow: 0 0 10px var(--sage-green);
            animation: pulse 2s infinite;
        }

        .status-inactive {
            background-color: var(--coral);
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.7;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .live-section {
                margin: 1rem;
                padding: 2rem 1rem;
            }

            .live-title {
                font-size: 2rem;
            }

            .camera-container {
                padding: 1.5rem;
            }

            .controls {
                flex-direction: column;
            }

            .btn-camera {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-fire"></i> WDS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/upload">Image Upload</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/live">Live Detection</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="live-section">
        <h1 class="live-title">Live Camera Detection</h1>
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <div class="detection-overlay" id="detectionOverlay">
                <div class="detection-text">
                    <span class="status-indicator" id="statusIndicator"></span>
                    <span id="detectionText">Detection Status</span>
                </div>
                <div class="confidence-text" id="confidenceText"></div>
            </div>
            <div class="controls">
                <button id="startBtn" class="btn btn-camera">
                    <i class="fas fa-video"></i> Start Camera
                </button>
                <button id="stopBtn" class="btn btn-camera" disabled>
                    <i class="fas fa-stop"></i> Stop Camera
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const detectionOverlay = document.getElementById('detectionOverlay');
        const statusIndicator = document.getElementById('statusIndicator');
        const detectionText = document.getElementById('detectionText');
        const confidenceText = document.getElementById('confidenceText');
        let stream = null;
        let isDetecting = false;
        let detectionInterval = null;

        // Start camera
        startBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                detectionOverlay.style.display = 'block';
                startDetection();
            } catch (err) {
                console.error('Error accessing camera:', err);
                alert('Error accessing camera. Please make sure you have granted camera permissions.');
            }
        });

        // Stop camera
        stopBtn.addEventListener('click', () => {
            stopDetection();
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            startBtn.disabled = false;
            stopBtn.disabled = true;
            detectionOverlay.style.display = 'none';
        });

        // Start detection loop
        function startDetection() {
            isDetecting = true;
            statusIndicator.classList.add('status-active');
            statusIndicator.classList.remove('status-inactive');
            
            detectionInterval = setInterval(async () => {
                if (!isDetecting) return;

                // Capture video frame
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);

                // Convert canvas to blob
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('file', blob, 'frame.jpg');

                    try {
                        const response = await fetch('/detect_live', {
                            method: 'POST',
                            body: formData
                        });
                        const result = await response.json();

                        // Update detection overlay
                        detectionText.textContent = result.prediction;
                        confidenceText.textContent = `Confidence: ${(result.confidence * 100).toFixed(2)}%`;
                        
                        // Update status indicator color based on detection
                        if (result.prediction === "Wildfire Detected") {
                            statusIndicator.style.backgroundColor = 'var(--coral)';
                            statusIndicator.style.boxShadow = '0 0 10px var(--coral)';
                        } else {
                            statusIndicator.style.backgroundColor = 'var(--sage-green)';
                            statusIndicator.style.boxShadow = '0 0 10px var(--sage-green)';
                        }
                    } catch (error) {
                        console.error('Detection error:', error);
                        detectionText.textContent = 'Detection Error';
                        confidenceText.textContent = 'Please try again';
                    }
                }, 'image/jpeg');
            }, 1000); // Detection every 1 second
        }

        // Stop detection loop
        function stopDetection() {
            isDetecting = false;
            if (detectionInterval) {
                clearInterval(detectionInterval);
                detectionInterval = null;
            }
            statusIndicator.classList.remove('status-active');
            statusIndicator.classList.add('status-inactive');
        }
    </script>
</body>
</html>
