<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - Wildfire Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --coral: #FF8B6B;
            --warm-orange: #FFB067;
            --light-yellow: #FFE5A3;
            --sage-green: #A6B985;
            --text-dark: #2C3E50;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--coral) 0%, var(--warm-orange) 50%, var(--light-yellow) 100%);
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .navbar-brand {
            color: var(--text-dark);
            font-weight: 700;
            font-size: 1.5rem;
        }

        .navbar-brand:hover {
            color: var(--coral);
        }

        .nav-link {
            color: var(--text-dark) !important;
            margin: 0 1rem;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: var(--coral) !important;
        }

        .nav-link.active {
            color: var(--coral) !important;
            font-weight: 600;
        }

        .upload-section {
            text-align: center;
            padding: 3rem 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, rgba(255, 229, 163, 0.9), rgba(166, 185, 133, 0.9));
            backdrop-filter: blur(10px);
            margin: 2rem;
            border-radius: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .upload-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            background: linear-gradient(45deg, var(--coral), var(--warm-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.1));
        }

        .upload-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 600px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .upload-card:hover {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .drop-zone {
            border: 2px dashed var(--coral);
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .drop-zone:hover {
            border-color: var(--warm-orange);
            background: rgba(255, 255, 255, 0.5);
        }

        .drop-zone.dragover {
            background: rgba(255, 255, 255, 0.7);
            border-color: var(--sage-green);
        }

        #preview {
            max-width: 100%;
            max-height: 300px;
            margin: 1rem 0;
            border-radius: 10px;
            display: none;
        }

        .btn-detect {
            background: linear-gradient(45deg, var(--coral), var(--warm-orange));
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-detect:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            color: white;
        }

        .btn-detect:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loader {
            display: none;
            width: 40px;
            height: 40px;
            margin: 1rem auto;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--coral);
            animation: spin 1s ease-in-out infinite;
        }

        .result-container {
            margin-top: 2rem;
            padding: 1rem;
            border-radius: 15px;
            display: none;
        }

        .result-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .confidence {
            font-size: 1rem;
            color: var(--text-dark);
            opacity: 0.8;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .upload-section {
                margin: 1rem;
                padding: 2rem 1rem;
            }

            .upload-title {
                font-size: 2rem;
            }

            .upload-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-fire"></i> WDS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/upload">Image Upload</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/live">Live Detection</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="upload-section">
        <h1 class="upload-title">Upload Image for Detection</h1>
        <div class="upload-card">
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="drop-zone" id="dropZone">
                    <i class="fas fa-cloud-upload-alt fa-3x mb-3" style="color: var(--coral)"></i>
                    <p class="mb-0">Drag and drop your image here or click to browse</p>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                </div>
                <img id="preview" alt="Preview">
                <div class="loader" id="loader"></div>
                <div class="result-container" id="resultContainer">
                    <p class="result-text" id="resultText"></p>
                    <p class="confidence" id="confidenceText"></p>
                </div>
                <button type="submit" class="btn btn-detect" id="detectBtn" disabled>
                    Detect Wildfire
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const uploadForm = document.getElementById('uploadForm');
        const detectBtn = document.getElementById('detectBtn');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('resultContainer');
        const resultText = document.getElementById('resultText');
        const confidenceText = document.getElementById('confidenceText');

        // Drag and drop handlers
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('dragover');
        }

        function unhighlight(e) {
            dropZone.classList.remove('dragover');
        }

        dropZone.addEventListener('drop', handleDrop, false);
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFiles);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles({ target: { files } });
        }

        function handleFiles(e) {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    detectBtn.disabled = false;
                }
                reader.readAsDataURL(file);
            }
        }

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            detectBtn.disabled = true;
            loader.style.display = 'block';
            resultContainer.style.display = 'none';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                resultText.textContent = result.prediction;
                confidenceText.textContent = `Confidence: ${(result.confidence * 100).toFixed(2)}%`;
                resultContainer.style.display = 'block';
            } catch (error) {
                resultText.textContent = 'Error processing image';
                resultContainer.style.display = 'block';
            } finally {
                loader.style.display = 'none';
                detectBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
